name: GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/check_site.py"
      - "scripts/check_benchmark_numbers.py"
      - "scripts/build_eval_map.py"
      - "scripts/eval-map.template.html"
      - "eval/runs/v1.7.0-final/**"
      - "eval/report-v1.7.0.md"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/check_site.py"
      - "scripts/check_benchmark_numbers.py"
      - "scripts/build_eval_map.py"
      - "scripts/eval-map.template.html"
      - "eval/runs/v1.7.0-final/**"
      - "eval/report-v1.7.0.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        run: python3 scripts/check_site.py

      - name: Eval map is what the run renders
        run: python3 scripts/build_eval_map.py --run v1.7.0-final --check

      - name: Validate benchmark figures
        run: python3 scripts/check_benchmark_numbers.py --run v1.7.0-final

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
