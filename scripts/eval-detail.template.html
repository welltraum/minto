<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.classList.add("js");</script>
    <meta name="theme-color" content="#f8f1e3">
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{canonical}}">
    <link rel="alternate" hreflang="en" href="{{url_en}}">
    <link rel="alternate" hreflang="ru" href="{{url_ru}}">
    <link rel="alternate" hreflang="x-default" href="{{url_en}}">
    <link rel="icon" href="{{dir_assets}}/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="{{dir_assets}}/fonts/GolosText-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{dir_assets}}/fonts/Play-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{dir_assets}}/mirai.css?v={{v_mirai}}">
    <link rel="stylesheet" href="{{dir_assets}}/styles.css?v={{v_styles}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Minto">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:image" content="https://welltraum.github.io/minto/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Minto turns a scattered draft into a clear argument structure">
    <meta name="twitter:card" content="summary_large_image">
    <title>{{title}}</title>
  </head>
  <body class="mr-root" data-tone="vivid"{{body_attrs}}>
    <a class="skip-link mr-button" data-variant="ghost" data-size="sm" href="#main">{{skip}}</a>

    <header class="site-header">
      <div class="page site-header__inner">
        <a class="brand" href="{{dir_home}}">
          <span class="brand__mark units" data-shape="pyramid" role="img" aria-label="{{brand_alt}}">
            <span class="units__row"><span class="unit"></span></span>
            <span class="units__row"><span class="unit"></span><span class="unit"></span></span>
            <span class="units__row"><span class="unit"></span><span class="unit"></span><span class="unit"></span></span>
          </span>
          <span class="brand__word">Minto</span>
        </a>

        <nav class="site-nav" aria-label="{{nav_sections}}">
          <a class="nav-link" href="{{dir_home}}#cases">{{nav_examples}}</a>
          <a class="nav-link" href="{{dir_home}}#evidence">{{nav_evidence}}</a>
          <a class="nav-link" href="{{dir_home}}#modes">{{nav_modes}}</a>
          <a class="nav-link" href="{{dir_home}}#install">{{nav_install}}</a>
        </nav>

        <nav class="lang" aria-label="{{nav_language}}">
          <a class="nav-link" href="{{href_en}}" lang="en"{{current_en}}>EN</a>
          <span class="label lang__sep" aria-hidden="true">/</span>
          <a class="nav-link" href="{{href_ru}}" lang="ru"{{current_ru}}>RU</a>
        </nav>
      </div>
    </header>

    <main class="page detail" id="main">
{{main}}
    </main>

    <footer class="site-footer">
      <div class="page site-footer__inner">
        <div class="brand site-footer__brand">
          <span class="brand__mark units" data-shape="pyramid" aria-hidden="true">
            <span class="units__row"><span class="unit"></span></span>
            <span class="units__row"><span class="unit"></span><span class="unit"></span></span>
            <span class="units__row"><span class="unit"></span><span class="unit"></span><span class="unit"></span></span>
          </span>
          <span class="brand__word">Minto</span>
        </div>
        <p class="small">{{footer_note}}</p>
        <nav aria-label="{{nav_links}}">
          <a class="nav-link" href="https://github.com/welltraum/minto">GitHub</a>
          <a class="nav-link" href="https://github.com/welltraum/minto/blob/main/CHANGELOG.md">{{footer_changelog}}</a>
          <a class="nav-link" href="{{dir_other}}">{{footer_switch}}</a>
        </nav>
      </div>
    </footer>

    <script src="{{dir_assets}}/app.js?v={{v_app}}" defer></script>
  </body>
</html>
