<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Minto: the decision reads in the first line</title>
  <desc id="og-desc">A Claude Code and Codex skill that settles the reader's question before it edits a single word.</desc>
  <style>
    @font-face { font-family: "Tektur"; src: url("./fonts/tektur-700-latin.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Golos Text"; src: url("./fonts/golos-text-latin.woff2") format("woff2"); font-weight: 400 700; }
    @font-face { font-family: "JetBrains Mono"; src: url("./fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 500 600; }
    .paper { fill: #fcf9f4; }
    .ink { fill: #27231f; }
    .soft { fill: #6c625a; }
    .accent { fill: #a04e36; }
    .rule { stroke: #8c8078; }
    .terracotta-stroke { stroke: #a04e36; }
    .sand { fill: #f2e7da; }
    .display { font-family: "Tektur", "Golos Text", Arial, sans-serif; font-weight: 700; font-size: 78px; letter-spacing: -1px; }
    .word { font-family: "Golos Text", Arial, sans-serif; font-weight: 700; font-size: 38px; }
    .label { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 22px; letter-spacing: 0.4px; }
  </style>

  <rect class="paper" width="1200" height="630"/>

  <g transform="translate(80 74)">
    <path class="terracotta-stroke" d="M18 3 33 30H3L18 3Z" fill="none" stroke-width="2.6" stroke-linejoin="round"/>
    <path class="rule" d="M8.4 20.5h19.2M12.8 12.5h10.4" fill="none" stroke-width="2.6"/>
    <text class="word ink" x="52" y="30">Minto</text>
  </g>

  <path class="rule" d="M80 152H1120" stroke-width="1.5"/>

  <text class="display ink" x="80" y="286">The decision reads</text>
  <text class="display accent" x="80" y="380">in the first line</text>

  <path class="rule" d="M80 430H560" stroke-width="1.5"/>

  <g transform="translate(80 470)">
    <rect class="sand" width="470" height="12" rx="6"/>
    <rect class="sand" y="34" width="392" height="12" rx="6"/>
    <rect class="accent" y="68" width="470" height="12" rx="6"/>
  </g>

  <g transform="translate(640 466)">
    <rect class="accent" width="470" height="14" rx="7"/>
    <rect class="sand" x="30" y="36" width="392" height="12" rx="6"/>
    <rect class="sand" x="30" y="68" width="356" height="12" rx="6"/>
  </g>

  <text class="label soft" x="80" y="592">ANSWER ON TOP &#183; POINTS OF ONE KIND &#183; GAPS NAMED</text>
</svg>
